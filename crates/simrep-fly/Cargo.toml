[package]
name = "simrep-fly"
description = "Field interpolation, integrators and particle flying (CPU/GPU)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu", "lua"]
gpu = ["dep:pollster", "dep:wgpu", "simrep-solve/gpu"]
lua = ["simrep-gem/lua"]
# Browser compute coexists with CPU f64 and excludes native blocking GPU APIs.
webgpu = ["dep:wgpu", "wgpu/webgpu", "simrep-solve/webgpu"]
# Diagnostic, one-source-at-a-time rounding experiments; no production knobs.
precision-study = []

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = { version = "1.0.1", optional = true }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simrep-core.workspace = true
simrep-geom.workspace = true
simrep-gem = { path = "../simrep-gem", default-features = false }
simrep-mesh.workspace = true
base64 = "0.22"
bincode = "1.3"
simrep-solve = { path = "../simrep-solve", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "dx12"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"
js-sys = "0.3"

[dev-dependencies]
simrep-io.workspace = true

[[test]]
name = "gpu_pic"
harness = false
required-features = ["gpu"]
