[package]
name = "simrep-solve"
description = "Potential solvers: multigrid (CPU/GPU), cut-cell, residual correction"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu", "dep:simrep-io"]
# Browser compute is asynchronous and does not enable native GPU or Lua IO.
webgpu = ["dep:bytemuck", "dep:wgpu", "wgpu/webgpu", "dep:futures-channel"]

[dependencies]
simrep-geom.workspace = true
simrep-core.workspace = true
simrep-io = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1.25.2", optional = true }
pollster = { version = "1.0.1", optional = true }
rayon = "1.12.0"
futures-channel = { version = "0.3", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "vulkan", "glsl"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[[test]]
name = "gpu_smoke"
harness = false
required-features = ["gpu"]

[[test]]
name = "gpu_multigrid"
harness = false
required-features = ["gpu"]

[[test]]
name = "dielectric_gpu"
harness = false
required-features = ["gpu"]

[[test]]
name = "gpu_poisson"
harness = false
required-features = ["gpu"]
