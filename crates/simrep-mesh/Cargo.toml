[package]
name = "simrep-mesh"
description = "Native triangle mesh import, voxelization, SDF and scientific export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
simrep-core.workspace = true
simrep-geom.workspace = true
rayon = "1.11"
stl_io = "0.11"
tobj = { version = "4.0", default-features = false, features = ["use_f64"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
serde_json = "1"
base64 = "0.22"
mcubes = "0.1.7"
earcutr = "0.5"

[dev-dependencies]
simrep-io.workspace = true
tempfile = "3"
