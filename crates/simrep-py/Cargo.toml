[package]
name = "simrep-py"
description = "NumPy and Python parameter scans for SIMION_Rep"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "dep:clap", "dep:rayon"]
cad = ["dep:simrep-cad", "simrep-cad/occt"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310"], optional = true }
numpy = { version = "0.27", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
rayon = { version = "1.11", optional = true }
simrep-cad = { path = "../simrep-cad", optional = true }
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10.9"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan"] }
simrep-core.workspace = true
simrep-io.workspace = true
simrep-solve.workspace = true
simrep-geom.workspace = true
simrep-gem.workspace = true
simrep-mesh.workspace = true
simrep-fly.workspace = true

[dev-dependencies]
tempfile = "3"
