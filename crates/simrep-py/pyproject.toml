[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "simrep"
version = "0.1.0"
description = "Native SIMION-compatible fields and particle flight for NumPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
examples = ["scipy>=1.10"]

[tool.maturin]
features = ["python", "pyo3/extension-module"]
python-source = "python"
module-name = "simrep._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
